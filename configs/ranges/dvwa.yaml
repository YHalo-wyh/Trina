# DVWA（Damn Vulnerable Web Application）—— 已在运行模式
# 启动方式：docker run -d -p 8081:80 vulnerables/web-dvwa，或在 WSL 里跑 php-apache
# 登录页默认凭据：admin/password（安装后会要求 setup，本配置使用常见的 dvwa/password）
name: dvwa
kind: web
adapter: http_range
description: "DVWA 漏洞演练平台（SQLi/XSS/命令注入/文件上传/文件包含/暴力破解，支持 Low~Impossible 难度）"
source: "https://github.com/digininja/DVWA"
base_url: "http://127.0.0.1:8081/dvwa"
probe_path: "/login.php"
timeout: 8

# 靶场自带凭据登录：先 GET 登录页拿 PHPSESSID，再 POST 提交，cookie 存进 session_cookies 供 Agent 复用。
login:
  url: "/dvwa/login.php"
  method: POST
  username: "dvwa"
  password: "password"
  user_field: username
  pass_field: password
  extra_fields:
    Login: "Login"
  success_marker: "Logout"
  auto: true

# 登录成功后把安全等级设为 low（低难度才是「已知有洞」的口径）。
after_login:
  - url: "/dvwa/security.php"
    method: POST
    data:
      security: low
      seclev_submit: "Submit"

flag_patterns:
  - 'flag\{[^}]{1,120}\}'
  - 'DVWA\{[^}]{1,120}\}'

ground_truth:
  - vuln_class: sqli
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/sqli/"
    parameter: id
    severity: high
    note: "Low 难度直接拼接：id=1' 报错，UNION SELECT 回显"
  - vuln_class: xss
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/xss_r/"
    parameter: name
    severity: medium
    note: "反射型 XSS（Low）：name=<script>alert(1)</script>"
  - vuln_class: xss
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/xss_s/"
    parameter: mtxMessage
    severity: medium
    note: "存储型 XSS（Low）：留言板持久回显"
  - vuln_class: cmd_inject
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/exec/"
    parameter: ip
    severity: critical
    note: "命令注入（Low）：ip=127.0.0.1;id（单次无害回显，禁止破坏性命令）"
  - vuln_class: file_upload
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/upload/"
    parameter: uploaded
    severity: critical
    note: "任意文件上传（Low）：仅上传无害探测文件验证扩展名校验缺失"
  - vuln_class: lfi
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/fi/"
    parameter: page
    severity: high
    note: "本地文件包含（Low）：page=../../../../etc/passwd"
  - vuln_class: weak_password
    target: "127.0.0.1:8081"
    url: "http://127.0.0.1:8081/dvwa/vulnerabilities/brute/"
    parameter: password
    severity: high
    note: "暴力破解页无锁定：使用小字典单次验证（受 scope.max_brute_attempts 限制）"

notes: >
  登录后的会话 cookie 在 adapter.session_cookies / cookie_header() 里，Agent 应复用该登录态；
  DVWA 的漏洞仅在 security=low 时成立，after_login 已自动切到 low。
