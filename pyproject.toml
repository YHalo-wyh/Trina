[project]
name = "trina"
version = "0.1.0"
description = "Trina · 全自动渗透测试 Agent"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "paramiko>=3.4",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
db = ["pymysql>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
trina = "trina.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trina"]
